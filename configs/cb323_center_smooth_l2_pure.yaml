experiment:
  name: cb803_center_final_smooth_v02
  well: CB803
  alignment: center

paths:
  input_npz: "D:/python_code/python_project/seismic_well/true_data_tyingCB803/true_datacode/_experiment_data/initial_model_data/initial_real_model_data_CB803.npz"
  result_dir: "D:/python_code/python_project/seismic_well/true_data_tyingCB803/true_datacode/_experiment_results/cb803_center_final_smooth_v02"

display:
  show_figures: true

wavelet:
  alignment: center
  length_s: 0.129
  data_window_factor: 2.0
  center_peak_allowed_ms: [-15.0, 15.0]
  causal_peak_allowed_ms: [0.0, 40.0]

stationary:
  mu1: 0.2
  mu2: 2.0
  mu_dc: 15.0
  damping_ratio: 0.003
  svd_cutoff_ratio: 0.001
  peak_lock: true

dtw:
  enable: true
  center_max_peak_shift_ms: 15.0
  phase_specs:
    - phase: envelope
      n_iter: 2
      alpha_candidates: [0.01, 0.05, 0.10, 0.15]
      max_shift_ms: 15.0
      smooth_ms: 20.0
      accept_min_cc_gain: 0.001
      accept_env_drop: 0.02
      accept_max_lag_ms: 10.0
    - phase: waveform
      n_iter: 2
      alpha_candidates: [0.01, 0.03, 0.06, 0.10]
      max_shift_ms: 10.0
      smooth_ms: 15.0
      accept_min_cc_gain: 0.0015
      accept_env_drop: 0.03
      accept_max_lag_ms: 8.0
    - phase: fine
      n_iter: 1
      alpha_candidates: [0.01, 0.02, 0.04, 0.06]
      max_shift_ms: 6.0
      smooth_ms: 8.0
      accept_min_cc_gain: 0.0005
      accept_env_drop: 0.03
      accept_max_lag_ms: 6.0

tv_wavelet:
  # 第一阶段固定使用 L2。
  # 确认回归测试通过后再改 Student-t。
  loss_type: "l2"

  mu1: 0.15
  mu2: 4.0
  mu_dc: 15.0
  mu_prior_strict: 1.0
  mu_prior_fallback: 0.8
  mu_time: 1.5
  energy_percentile: 25.0
  damping_ratio: 0.003
  svd_cutoff_ratio: 0.001
  estimate_step_ms: 5.0
  time_smooth_ms: 20.0
  wavelet_smooth_sigma: 3.0
  reject_ill_conditioned: true
  reject_amplitude_jumps: true

q:
  enable: false
  f_min_base: 8.0
  f_min_ratio_of_f_dom: 0.3
  f_max_cap: 60.0
  f_max_ratio_of_f_dom: 2.0
  ref_range: [0.20, 0.35]
  deep_range: [0.65, 0.85]
  Q_min: 20.0
  Q_max: 200.0
  freeze_above_ref: true
  max_cc_drop_vs_tv: 0.005
  max_env_drop_vs_tv: 0.03
  max_lag_ms: 8.0

local_wavelet_fallback:
  enable: true
  peak_limit_ms: 15.0
  energy_min: 0.15
  pad_ms: 0.0
  alpha_smooth_samples: 15.0
  use_shape_qc: true
  side_lobe_limit_reliable: 0.75
  side_lobe_limit_fallback: 0.95
  side_lobe_guard_ms: 12.0
  edge_energy_limit_reliable: 0.15
  edge_energy_limit_fallback: 0.30
  edge_fraction: 0.15

acceptance:
  min_gain_vs_dtw: 0.005
  min_gain_vs_stationary: 0.02
  max_env_drop_vs_stationary: 0.02
  max_lag_ms: 8.0
  center_peak_median_ms: 6.0
  center_peak_abs_p90_ms: 17.0
  causal_peak_extra_margin_ms: 2.0
  tolerance_ms: 1.0e-6
  tolerance_cc: 1.0e-12
